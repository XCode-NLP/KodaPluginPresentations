<!doctype html>
<html lang="ru">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Презентации</title>
    <link rel="stylesheet" href="tokens.css" />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <header>
      <input id="title" class="deck-title" maxlength="200" data-label="title" hidden />
      <span id="heading" class="heading" data-text="heading"></span>
      <output id="status" aria-live="polite"></output>
      <div class="header-tools">
        <button id="undo" class="icon-button" data-label="undo" hidden>
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M9 14 4 9l5-5" /><path d="M4 9h11a5 5 0 0 1 0 10h-3" /></svg>
        </button>
        <button id="redo" class="icon-button" data-label="redo" hidden>
          <svg viewBox="0 0 24 24" aria-hidden="true"><path d="m15 14 5-5-5-5" /><path d="M20 9H9a5 5 0 0 0 0 10h3" /></svg>
        </button>
        <div class="menu-anchor">
          <button id="file-menu-button" class="icon-button" data-label="more" aria-haspopup="menu" aria-expanded="false">
            <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="5" cy="12" r="1" /><circle cx="12" cy="12" r="1" /><circle cx="19" cy="12" r="1" /></svg>
          </button>
          <div id="file-menu" class="menu" role="menu" hidden>
            <button id="create" role="menuitem" disabled>
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14" /></svg><span data-text="newDeck"></span>
            </button>
            <button id="open" role="menuitem" disabled>
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 20H4a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v10a2 2 0 0 1-2 2z" /></svg
              ><span data-text="openEllipsis"></span>
            </button>
            <button id="import" role="menuitem" disabled>
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3v12m-4-4 4 4 4-4M4 16v4h16v-4" /></svg><span data-text="import"></span>
            </button>
          </div>
        </div>
        <div class="menu-anchor" id="export-anchor" hidden>
          <button id="export-button" class="primary-button" aria-haspopup="menu" aria-expanded="false">
            <span data-text="export"></span><svg class="chevron" viewBox="0 0 24 24" aria-hidden="true"><path d="m6 9 6 6 6-6" /></svg>
          </button>
          <div id="export-menu" class="menu" role="menu" hidden>
            <button id="pptx" role="menuitem">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3v12m-4-4 4 4 4-4M4 16v4h16v-4" /></svg>PowerPoint (.pptx)
            </button>
            <button id="pdf" role="menuitem">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3v12m-4-4 4 4 4-4M4 16v4h16v-4" /></svg>PDF
            </button>
          </div>
        </div>
      </div>
    </header>
    <div id="feedback" hidden>
      <span id="feedback-text"></span>
      <button id="retry" data-text="retry" hidden></button>
      <button id="reveal" data-text="reveal" hidden></button>
    </div>
    <main>
      <div id="empty">
        <div class="empty-copy">
          <h1 data-text="emptyTitle"></h1>
          <p id="empty-message"></p>
        </div>
        <div class="empty-actions" id="empty-actions">
          <button class="action-card" data-proxy="create">
            <span class="action-icon"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14" /></svg></span>
            <span><b data-text="newDeck"></b><small data-text="newDeckHint"></small></span>
          </button>
          <button class="action-card" data-proxy="open">
            <span class="action-icon"
              ><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M20 20H4a2 2 0 0 1-2-2V6a2 2 0 0 1 2-2h4l2 2h8a2 2 0 0 1 2 2v10a2 2 0 0 1-2 2z" /></svg
            ></span>
            <span><b data-text="openEllipsis"></b><small data-text="openHint"></small></span>
          </button>
          <button class="action-card" data-proxy="import">
            <span class="action-icon"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3v12m-4-4 4 4 4-4M4 16v4h16v-4" /></svg></span>
            <span><b data-text="import"></b><small data-text="importHint"></small></span>
          </button>
          <p class="empty-tip" data-text="agentTip"></p>
        </div>
      </div>
      <section id="editor" hidden>
        <nav class="rail">
          <div id="filmstrip" data-label="slides"></div>
        </nav>
        <div class="stage">
          <div class="stage-bar">
            <div class="menu-anchor">
              <button id="add-slide-button" class="ghost-button add-slide" aria-haspopup="menu" aria-expanded="false">
                <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M5 12h14" /></svg><span data-text="addSlide"></span
                ><svg class="chevron" viewBox="0 0 24 24" aria-hidden="true"><path d="m6 9 6 6 6-6" /></svg>
              </button>
              <div id="layout-menu" class="menu menu-start" role="menu" hidden></div>
            </div>
            <select id="layout" data-label="layout" hidden></select>
            <button id="add-slide" hidden></button>
            <span id="position" class="position"></span>
            <span class="spacer"></span>
            <button id="back" class="icon-button" data-label="back">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 19V5m-5 5 5-5 5 5" /></svg>
            </button>
            <button id="forward" class="icon-button" data-label="forward">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14m-5-5 5 5 5-5" /></svg>
            </button>
            <button id="duplicate" class="icon-button" data-label="duplicate">
              <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="8" y="8" width="12" height="12" rx="2" /><path d="M16 4H6a2 2 0 0 0-2 2v10" /></svg>
            </button>
            <button id="delete-slide" class="icon-button danger" data-label="deleteSlide">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M9 7V4h6v3M6 7l1 13h10l1-13M10 11v5m4-5v5" /></svg>
            </button>
          </div>
          <div id="workspace">
            <div id="sheet"></div>
            <div class="dock" role="toolbar" data-label="insert">
              <button class="icon-button" data-kind="text" data-label="text">
                <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7V5h16v2M12 5v14M9 19h6" /></svg>
              </button>
              <button class="icon-button" data-kind="rect" data-label="rect">
                <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="4" y="5" width="16" height="14" rx="2" /></svg>
              </button>
              <button class="icon-button" data-kind="ellipse" data-label="ellipse">
                <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="12" cy="12" r="8" /></svg>
              </button>
              <button class="icon-button" data-kind="line" data-label="line">
                <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 19 19 5" /></svg>
              </button>
              <button class="icon-button" data-kind="image" data-label="image">
                <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="4" width="18" height="16" rx="2" /><circle cx="9" cy="10" r="2" /><path d="m21 16-5-5-9 9" /></svg>
              </button>
            </div>
          </div>
          <select id="kind" data-label="kind" hidden></select>
          <button id="add-object" hidden data-text="addObject"></button>
          <input id="image-file" type="file" accept="image/png,image/jpeg,image/webp" hidden />
          <div id="context">
            <span id="selection"></span>
            <button id="discuss" class="ghost-button">
              <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3l1.8 4.7 4.7 1.8-4.7 1.8L12 16l-1.8-4.7-4.7-1.8 4.7-1.8z" /></svg
              ><span data-text="discuss"></span>
            </button>
          </div>
          <details id="warnings" hidden>
            <summary data-text="report"></summary>
            <ul></ul>
          </details>
        </div>
        <aside id="properties" class="inspector" hidden>
          <div class="section" data-group="text">
            <h2 data-text="textSection"></h2>
            <label class="field wide"><span data-text="font"></span><input id="font" maxlength="100" /></label>
            <label class="field"><span data-text="size"></span><input id="size" type="number" min="4" max="600" /></label>
            <label class="field"><span data-text="align"></span><select id="align"></select></label>
            <div class="toggles">
              <label class="toggle" data-label="bold"><input id="bold" type="checkbox" /><b>B</b></label>
              <label class="toggle" data-label="italic"><input id="italic" type="checkbox" /><i>I</i></label>
              <label class="swatch" data-label="color"><input id="color" type="color" /></label>
            </div>
            <button id="edit-text" class="ghost-button wide" data-text="editText"></button>
          </div>
          <div class="section">
            <h2 data-text="shapeSection"></h2>
            <div class="color-row">
              <label class="swatch" data-label="fill"><input id="fill" type="color" /></label>
              <span data-text="fill"></span>
              <label class="check"><input id="no-fill" type="checkbox" /><span data-text="noFill"></span></label>
            </div>
            <div class="color-row">
              <label class="swatch" data-label="stroke"><input id="stroke" type="color" /></label>
              <span data-text="stroke"></span>
              <label class="check"><input id="no-stroke" type="checkbox" /><span data-text="noStroke"></span></label>
            </div>
          </div>
          <div class="section">
            <h2 data-text="arrangeSection"></h2>
            <div class="toggles">
              <button id="lower" class="icon-button" data-label="lower">
                <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14m-5-5 5 5 5-5" /></svg>
              </button>
              <button id="raise" class="icon-button" data-label="raise">
                <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 19V5m-5 5 5-5 5 5" /></svg>
              </button>
              <span class="spacer"></span>
              <button id="remove-object" class="icon-button danger" data-label="removeObject">
                <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M4 7h16M9 7V4h6v3M6 7l1 13h10l1-13M10 11v5m4-5v5" /></svg>
              </button>
            </div>
          </div>
        </aside>
      </section>
    </main>
    <dialog id="open-dialog">
      <form method="dialog">
        <h2 data-text="open"></h2>
        <select id="documents" data-label="title" required></select>
        <div class="dialog-actions">
          <button value="cancel" formnovalidate data-text="cancel"></button
          ><button value="ok" class="primary-button" data-text="open"></button>
        </div>
      </form>
    </dialog>
    <dialog id="import-dialog">
      <form method="dialog">
        <h2 data-text="import"></h2>
        <label for="source" data-text="source"></label
        ><input id="source" placeholder="slides/example.pptx" required maxlength="500" />
        <div class="dialog-actions">
          <button value="cancel" formnovalidate data-text="cancel"></button
          ><button value="ok" class="primary-button" data-text="import"></button>
        </div>
      </form>
    </dialog>
    <div id="stage" aria-hidden="true"></div>
    <script type="module" src="app.js"></script>
  </body>
</html>
